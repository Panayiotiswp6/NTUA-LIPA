name: Deploy Digital Twin to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - digital-twin-demo/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digital-twin-demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digital-twin-demo/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build -- --base=/NTUA-LIPA/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: digital-twin-demo/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
